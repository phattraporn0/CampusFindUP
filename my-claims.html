<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>รายการที่ฉันเคลม | CampusFind UP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body { background: #f7f8fc; }
        .claims-page { max-width: 1180px; margin: 0 auto; padding: 42px 24px 70px; }
        .claims-head { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
        .claims-head a { color:#4f46e5; text-decoration:none; font-weight:600; }
        .claims-list { display:grid; gap:18px; }
        .claim-card { display:flex; gap:20px; align-items:center; background:#fff; border-radius:22px; padding:18px; box-shadow:0 8px 24px rgba(15,23,42,.08); }
        .claim-image { width:132px; height:132px; flex:0 0 132px; border-radius:14px; overflow:hidden; background:#eef1f8; display:grid; place-items:center; color:#64748b; }
        .claim-image img { width:100%; height:100%; object-fit:cover; }
        .claim-info { flex:1; }
        .claim-info h2 { margin:8px 0; }
        .claim-info p { margin:5px 0; color:#64748b; }
        .claim-status { float:right; color:#64748b; font-size:14px; }
        .claim-detail-btn { margin-top:12px; width:100%; border:0; border-radius:10px; padding:11px 14px; background:#4f46e5; color:#fff; font:inherit; cursor:pointer; }
        .empty-claims { background:#fff; border-radius:22px; padding:50px 20px; text-align:center; color:#64748b; }
        @media (max-width:650px) { .claims-head { align-items:flex-start; flex-direction:column; } .claim-card { align-items:flex-start; flex-direction:column; } .claim-image { width:100%; height:190px; flex-basis:190px; } .claim-status { float:none; } }
    </style>
</head>
<body>
    <main class="claims-page">
        <div class="claims-head">
            <div>
                <h1>รายการที่ฉันเคลม</h1>
                <p>รายการที่ยืนยันความเป็นเจ้าของแล้ว รอเจ้าหน้าที่ส่งคืน</p>
            </div>
            <a href="dashboard.html">กลับหน้าหลัก</a>
        </div>
        <div id="claimsTotal" class="total-item">0 รายการ</div>
        <section id="claimsList" class="claims-list">
            <div class="empty-claims">กำลังโหลดรายการเคลม...</div>
        </section>
    </main>
    <script type="module" src="my-claims.js"></script>
</body>
</html>
