<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>รายการสิ่งของทั้งหมด | CampusFind UP</title>

    <link rel="stylesheet"
        href="admin-items.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="admin-header">

    <div class="logo">

        <i class="fa-solid fa-shield-halved"></i>

        <span>FindIt Campus</span>

    </div>

    <button
        class="back-btn"
        onclick="window.location.href='admin-dashboard.html'">

        <i class="fa-solid fa-arrow-left"></i>

        กลับ Dashboard

    </button>

</header>


<main class="admin-container">

    <div class="page-title">

        <h1 id="itemsTitle">รายการสิ่งของทั้งหมด</h1>

        <p>
            รายการสิ่งของทั้งหมดที่มีอยู่ในระบบ
        </p>

    </div>


    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="ค้นหารหัส หรือชื่อสิ่งของ...">

    </div>


    <div class="item-count">

        ทั้งหมด
        <strong id="itemCount">0</strong>
        รายการ

    </div>


    <section
        id="itemList"
        class="item-list">

    </section>

</main>


<script  type="module" src="admin-items.js"></script>

</body>

</html>
