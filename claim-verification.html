<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusFind UP | ยืนยันความเป็นเจ้าของ</title>

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: "Prompt", sans-serif;

            background: #F7F8FC;

            color: #222;

        }

        .topbar {

            height: 88px;

            background: #4338CA;

            color: white;

            display: flex;

            align-items: center;

            padding: 0 60px;

        }

        .logo {

            display: flex;

            align-items: center;

            gap: 18px;

        }

        .logo-icon {

            width: 55px;
            height: 55px;

            border-radius: 14px;

            background: #F59E0B;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 24px;

        }

        .logo h2 {

            font-size: 30px;

        }

        .logo span {

            color: #F59E0B;

        }

        .logo p {

            font-size: 14px;

            opacity: .9;

        }

        .container {

            max-width: 800px;

            margin: auto;

            padding: 60px 20px;

        }

        .back-btn {

            display: inline-flex;

            gap: 10px;

            align-items: center;

            text-decoration: none;

            color: #666;

            margin-bottom: 35px;

        }

        .card {

            background: white;

            border-radius: 24px;

            padding: 45px;

            box-shadow: 0 10px 30px rgba(0,0,0,.06);

        }

        .icon {

            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #EEF2FF;

            color: #4F46E5;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

        }

        h1 {

            text-align: center;

            font-size: 36px;

            margin-bottom: 12px;

        }

        .subtitle {

            text-align: center;

            color: #777;

            line-height: 1.7;

            margin-bottom: 35px;

        }

        .question-box {

            background: #F7F8FF;

            border: 1px solid #DDE2FF;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 25px;

        }

        .question-box label {

            display: block;

            font-weight: 600;

            margin-bottom: 12px;

            font-size: 18px;

        }

        textarea {

            width: 100%;

            min-height: 140px;

            padding: 15px;

            border: 1px solid #D8DCE5;

            border-radius: 12px;

            resize: vertical;

            font-family: "Prompt", sans-serif;

            font-size: 16px;

            outline: none;

        }

        textarea:focus {

            border-color: #4F46E5;

            box-shadow: 0 0 0 4px rgba(79,70,229,.1);

        }

        .attempt {

            text-align: center;

            color: #777;

            margin-bottom: 20px;

        }

        .submit-btn {

            width: 100%;

            padding: 17px;

            border: none;

            border-radius: 14px;

            background: #4F46E5;

            color: white;

            font-family: "Prompt", sans-serif;

            font-size: 18px;

            cursor: pointer;

        }

        .submit-btn:hover {

            background: #4338CA;

        }

        @media(max-width:600px) {

            .topbar {

                padding: 20px;

            }

            .card {

                padding: 25px;

            }

            h1 {

                font-size: 30px;

            }

        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="logo">

        <div class="logo-icon">

            <i class="fa-solid fa-location-dot"></i>

        </div>

        <div>

            <h2>CampusFind <span>UP</span></h2>

            <p>ระบบแจ้งและติดตามของหาย</p>
        </div>

    </div>

</header>


<main class="container">

    <a href="dashboard.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        กลับหน้าหลัก

    </a>


    <section class="card">

        <div class="icon">

            <i class="fa-solid fa-shield-halved"></i>

        </div>


        <h1>ยืนยันความเป็นเจ้าของ</h1>

        <p class="subtitle">

            กรุณาตอบคำถามเกี่ยวกับลักษณะเฉพาะของสิ่งของ
            เพื่อยืนยันว่าคุณเป็นเจ้าของสิ่งของจริง

        </p>


        <div class="question-box">

            <label>

                จุดเด่น / ตำหนิของสิ่งของคืออะไร?

            </label>

            <textarea
                id="answer"
                placeholder="กรุณาระบุจุดเด่นหรือตำหนิของสิ่งของ">
            </textarea>

        </div>


        <p class="attempt">

            เหลือโอกาสตอบอีก <strong id="attemptCount">3</strong> ครั้ง

        </p>


        <button
            type="button"
            id="submitAnswer"
            class="submit-btn">

            ส่งคำตอบเพื่อยืนยัน

        </button>

    </section>

</main>


<script type="module" src="claim-verification.js"></script>

</body>

</html>
