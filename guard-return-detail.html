<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>รายละเอียดสิ่งของ</title>

    <link rel="stylesheet"
        href="guard-return-detail.css">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>

<header class="guard-header">

    <button onclick="window.location.href='guard-items.html'">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <h1>รายละเอียดสิ่งของ</h1>

</header>


<main class="return-container">

    <div id="returnDetail"></div>


    <button
        class="scan-btn"
        id="scanBtn">

        <i class="fa-solid fa-qrcode"></i>

        สแกน QR Code

    </button>

    <button
        class="scan-btn photo-btn"
        id="photoBtn">

        <i class="fa-solid fa-camera"></i>

        ถ่ายรูปเจ้าของคู่กับสิ่งของ

    </button>

    <button class="scan-btn complete-btn" id="completeBtn" hidden>
        <i class="fa-solid fa-check-double"></i>
        ยืนยันบันทึกการส่งคืนและจบงาน
    </button>

</main>


<script script type="module" src="guard-return-detail.js"></script>

</body>

</html>
