<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind UP | Report Found Item</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="report-found.css">

</head>

<body>

    <!-- Header -->

    <header class="topbar">

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div>

                <h2>CampusFind <span>UP</span></h2>

                <p>ระบบแจ้งและติดตามของหาย</p>

            </div>

        </div>

        <a href="#">ติดต่อเจ้าหน้าที่</a>

    </header>

    <!-- Main -->

    <main class="container">

        <a href="dashboard.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            กลับหน้าหลัก

        </a>

        <h1>แจ้งพบของหาย</h1>

        <p class="subtitle">

            ขอบคุณที่ช่วยเก็บของมาส่งคืน กรุณากรอกรายละเอียดเพื่อให้เจ้าของมารับคืนได้ง่ายขึ้น

        </p>

        <!-- Card 1 -->

        <section class="card">

            <div class="card-header">

                <i class="fa-solid fa-circle-info"></i>

                <div>

                    <h3>ข้อมูลสิ่งของที่พบ</h3>

                    <p>ระบุรายละเอียดและลักษณะเด่นของสิ่งของ</p>

                </div>

            </div>

            <div class="card-body">

                <div class="form-group">

                    <label>หมวดหมู่สิ่งของ <span>*</span></label>

                    <select id="category" required>
                        <option value="กระเป๋าและสัมภาระ">กระเป๋าและสัมภาระ</option>
                        <option value="บัตรและเอกสาร">บัตรและเอกสาร</option>
                        <option value="อุปกรณ์อิเล็กทรอนิกส์">อุปกรณ์อิเล็กทรอนิกส์</option>
                        <option value="กุญแจและอุปกรณ์ล็อก">กุญแจและอุปกรณ์ล็อก</option>
                        <option value="เครื่องแต่งกายและของใช้ส่วนตัว">เครื่องแต่งกายและของใช้ส่วนตัว</option>
                        <option value="เครื่องเขียนและอุปกรณ์การเรียน">เครื่องเขียนและอุปกรณ์การเรียน</option>
                        <option value="อุปกรณ์กีฬา">อุปกรณ์กีฬา</option>
                        <option value="other">อื่น ๆ</option>
                    </select>
                    <div id="otherCategoryBox" style="display:none; margin-top:15px;">

    <input
        type="text"
        id="otherCategory"
        placeholder="โปรดระบุหมวดหมู่"
    >

</div>

                </div>

                <div class="form-group">
                    <label>ประเภทย่อย <span>*</span></label>
                    <select id="subcategory" required>
                        <option value="">-- เลือกประเภทย่อย --</option>
                    </select>
                    <div id="otherSubcategoryBox" style="display:none; margin-top:12px;">
                        <input type="text" id="otherSubcategory" placeholder="โปรดระบุประเภทย่อย">
                    </div>
                </div>

                <div class="form-group">

                    <label>สถานที่พบ <span>*</span></label>

                    <input
    type="text"
    id="foundLocation"
    required
    placeholder="เช่น โรงอาหารกลาง โต๊ะริมหน้าต่าง"
>

                </div>

                <div class="two-column">

                    <div class="form-group">

                        <label>วันที่พบ <span>*</span></label>

                       <input
    type="date"
    id="foundDate"
    required
>

                    </div>

                    <div class="form-group">

                        <label>เวลาที่พบ (โดยประมาณ)</label>

                        <input
    type="time"
    id="foundTime"
>

                    </div>

                </div>

                <div class="form-group">

                    <label>ชื่อสิ่งของ <span>*</span></label>
                    <input type="text" id="itemName" placeholder="เช่น พัดลม Hatari หรือ ปากกา Lamy" required>

                </div>

                <div class="form-group">
                    <label>ยี่ห้อ <span>*</span></label>
                    <input type="text" id="brand" placeholder="เช่น Samsung, Coach หรือไม่ทราบ" required>
                </div>

                <div class="two-column">
                    <div class="form-group">
                        <label>สี <span>*</span></label>
                        <input type="text" id="color" placeholder="เช่น ดำ น้ำเงิน หรือหลายสี" required>
                    </div>
                    <div class="form-group">
                        <label>วัสดุ <span>*</span></label>
                        <input type="text" id="material" placeholder="เช่น ผ้า โลหะ หรือพลาสติก" required>
                    </div>
                </div>

<div class="form-group">

    <label>รายละเอียดของสิ่งของ <span>*</span></label>
    <textarea
        id="itemDescription"
        required
        rows="5"
        placeholder="เช่น กระเป๋าเป้สีดำ มีช่องใส่ของด้านหน้า"></textarea>

</div>

                <div class="form-group">

                    <label>รูปภาพสิ่งของ (ถ้ามี)</label>

                    <input
                        type="file"
                        id="itemImage"
                        accept="image/*"
                        hidden
                    >

                    <label
                        for="itemImage"
                        class="upload-box"
                    >

                        <div class="upload-icon">

                            <i class="fa-solid fa-plus"></i>

                        </div>

                        <h3>คลิกเพื่ออัปโหลดรูปภาพ</h3>

                        <p>รองรับ JPG, PNG สูงสุด 5MB</p>

                    </label>

                </div>

                <div class="form-group">
                    <label>จุดเด่นของสิ่งของ <span>*</span></label>
                    <textarea
                        id="distinctiveFeature"
                        required
                        rows="4"
                        placeholder="เช่น มีสติกเกอร์รูปแมวด้านหลัง หรือมีรอยขีดที่มุมขวา"></textarea>
                </div>

            </div>

        </section>

        <!-- Card 2 -->

        <section class="card">

            <div class="card-header">

                <i class="fa-solid fa-shield"></i>

                <div>

                    <h3>จุดส่งมอบ</h3>

                    <p>เลือกสถานที่ที่คุณนำสิ่งของไปฝากไว้</p>

                </div>

            </div>

            <div class="card-body">

                <div class="form-group">

                    <label>ป้อมยาม / จุดรับฝาก <span>*</span></label>

                    <select id="storageLocation">

                        <option>ป้อมยาม ประตู 1</option>
                        <option>ป้อมยาม ประตู 2</option>
                        <option>ป้อมยาม ประตู 3</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>ข้อมูลลับสำหรับยืนยันเจ้าของ <span>*</span></label>

                    <textarea
    id="additionalNote"
    rows="4"
    placeholder="เช่น ตำหนิที่ไม่เปิดเผย หรือสิ่งที่อยู่ภายในกระเป๋า"
    required
></textarea>

                </div>

            </div>

        </section>

        <div class="button-group">

            <button
                type="button"
                class="cancel-btn"
            >
                ยกเลิก
            </button>

            <button
    type="button"
    class="save-btn">

    บันทึกข้อมูล

</button>

        </div>

    </main>

    <script type="module" src="report-found.js"></script>
    <script>
    (() => {
        const arrange = () => {
            const ids = ['category', 'subcategory', 'itemName', 'brand', 'color', 'material', 'itemDescription', 'distinctiveFeature', 'foundLocation', 'foundDate', 'itemImage'];
            const fields = ids.map((id) => document.getElementById(id));
            if (fields.some((field) => !field)) return;
            const groups = fields.map((field) => field.closest('.form-group') || field.closest('.two-column'));
            const parent = groups[0]?.parentElement;
            if (!parent || groups.some((group) => !group || group.parentElement !== parent)) return;
            [...new Set(groups)].forEach((group) => parent.appendChild(group));
            const nameGroup = document.getElementById('itemName')?.closest('.form-group');
            const labels = nameGroup?.querySelectorAll(':scope > label');
            if (labels?.length > 1) labels[0].remove();
            const upload = document.querySelector('.upload-box');
            document.getElementById('itemImage')?.addEventListener('change', () => {
                if (upload?.querySelector('.selected-image-preview')) upload.classList.add('has-photo');
            }, { once: true });
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrange); else arrange();
    })();
    </script>

</body>

</html>
